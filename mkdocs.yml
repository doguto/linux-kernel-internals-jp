site_name: Linux Kernel Internals 日本語版
site_description: Linuxカーネルの内部構造、設計判断、コントリビュートの道のりに関するドキュメント（kernel-internals.org の非公式日本語訳）
site_url: https://doguto.github.io/linux-kernel-internals-jp/
repo_url: https://github.com/doguto/linux-kernel-internals-jp
copyright: '原文 <a href="https://kernel-internals.org/">kernel-internals.org</a>（<a href="https://github.com/laveeshb/linux-kernel-internals">laveeshb/linux-kernel-internals</a>）を翻訳。ドキュメントは <a href="https://creativecommons.org/licenses/by-sa/4.0/deed.ja">CC BY-SA 4.0</a>、コード片は GPL-2.0 で提供される。'

theme:
  name: material
  language: ja
  logo: assets/tux.svg
  favicon: assets/tux-outline.svg
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: ダークモードに切り替え
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: ライトモードに切り替え
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - content.code.copy
    - search.highlight
    - search.share

markdown_extensions:
  - tables
  - admonition
  - def_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - attr_list

plugins:
  - search

# Fail the build on broken internal links AND broken #anchor fragments.
# MkDocs defaults `anchors` to `info`, so `--strict` would otherwise let a
# wrong section slug through; `warn` promotes it to a strict-mode failure.
validation:
  links:
    anchors: warn
    unrecognized_links: warn

# Open external links in new tab
extra:
  generator: false
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/laveeshb/linux-kernel-internals
    - icon: fontawesome/solid/comments
      link: https://github.com/laveeshb/linux-kernel-internals/discussions
      name: Discussions（原文）
    - icon: fontawesome/solid/bug
      link: https://github.com/laveeshb/linux-kernel-internals/issues
      name: Issues（原文）

# This makes external links open in new tabs
extra_css:
  - stylesheets/extra.css

extra_javascript:
  - javascripts/external-links.js

